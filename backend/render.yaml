services:
  - type: web
    name: vibecity-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: META_OAUTH_TOKEN
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: AUTO_MIGRATE
        value: "true"