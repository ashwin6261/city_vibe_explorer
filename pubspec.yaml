name: city_vibe_explorer
description: "A smart city exploration Flutter app featuring live Google Maps, real-time GPS tracking, curated visual food stalls, top visited spots, and mood-based recommendations."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Google Maps Flutter SDK (official)
  google_maps_flutter: ^2.5.3
  # Geolocation & GPS tracking
  geolocator: ^10.1.0
  # HTTP client for Google Places & Routes APIs
  http: ^1.2.0
  # URL launcher for turn-by-turn navigation in Google Maps
  url_launcher: ^6.2.4
  # Icons & UI enhancements
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

