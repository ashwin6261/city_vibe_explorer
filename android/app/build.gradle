plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterSdkPath = localProperties.getProperty("flutter.sdk")
if (flutterSdkPath == null) {
    throw new GradleException("flutter.sdk not set in local.properties")
}

// Maps/Places key resolved from a Gradle property (-P) or environment variable.
// Empty when not provided so the build still succeeds; the map then runs unkeyed.
def googleMapsApiKey = (project.findProperty("GOOGLE_MAPS_API_KEY")
        ?: System.getenv("GOOGLE_MAPS_API_KEY")
        ?: "")

android {
    namespace = "com.example.city_vibe_explorer"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId = "com.example.city_vibe_explorer"
        minSdk = 21
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders = [GOOGLE_MAPS_API_KEY: googleMapsApiKey, applicationName: "android.app.Application"]
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_FILE")
            if (keystorePath != null && !keystorePath.isEmpty()) {
                storeFile = file(keystorePath)
                storePassword = System.getenv("STORE_PASSWORD")
                keyAlias = System.getenv("KEY_ALIAS")
                keyPassword = System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            def keystorePath = System.getenv("KEYSTORE_FILE")
            if (keystorePath != null && !keystorePath.isEmpty()) {
                // Real release signing when KEYSTORE_FILE / STORE_PASSWORD /
                // KEY_ALIAS / KEY_PASSWORD are provided (e.g. CI secrets).
                signingConfig = signingConfigs.release
            } else {
                // No keystore configured (local prototype or CI without signing
                // secrets): fall back to debug signing so the build still works.
                // Never distribute an APK built this way.
                signingConfig = signingConfigs.debug
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

flutter {
    source = "../.."
}