name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get
        working-directory: city_vibe_explorer

      - name: Build APK
        run: flutter build apk --release
        working-directory: city_vibe_explorer

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CityVibeExplorer-release-apk
          path: city_vibe_explorer/build/app/outputs/flutter-apk/app-release.apk

