name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Pinned to 3.29.3 because the project uses AGP 8.5.2 / Gradle 8.9, which
      # Flutter stable (3.50+) rejects (it requires Gradle >= 9.3.1 / AGP 9.x).
      # 3.29.3 supports AGP up to 8.7.1 and Gradle 8.x, matching this project.
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true

      # The Gradle wrapper (gradlew + gradle-wrapper.jar) is not committed, so
      # generate it. `flutter create` only fills in missing files and never
      # overwrites the committed manifest / build.gradle / wrapper properties.
      - name: Generate Android platform files (Gradle wrapper)
        run: flutter create . --platforms=android --org com.example --project-name city_vibe_explorer

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: flutter build apk --release --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CityVibeExplorer-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "City Vibe Explorer v1.2.0 APK"
          body: "Direct Android APK download for City Vibe Explorer. Install on any Android device to explore visual street food and top sights!"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}